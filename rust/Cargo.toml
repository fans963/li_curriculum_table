[package]
name = "rust_lib_li_curriculum_table"
version = "0.1.0"
edition = "2021"

[features]
default = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-bulk-memory",
    "--enable-threads",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-simd",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.0"
flutter_rust_bridge = "=2.12.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "cookies",
    "json",
    "stream",
] }
log = "0.4.33"
scraper = "0.27.0"
burn = { version = "0.21.0", default-features = false, features = ["std"] }
burn-flex = { version = "0.21.0", default-features = false, features = ["std"] }
burn-store = { version = "0.21.0", default-features = false, features = [
    "std",
    "burnpack",
] }
half = { version = "2.7.1", features = ["num-traits"] }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = ["sync", "macros"] }
futures-util = "0.3"
regex-lite = "0.1.9"
url = "2.5.8"
encoding_rs = "0.8.35"
rayon = "1.12.0"

[build-dependencies]
burn-onnx = "0.21.0"
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
half = { version = "2.7.1", features = ["num-traits", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
burn = { version = "0.21.0" }
burn-store = { version = "0.21.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.51.1", features = ["net", "time", "fs", "io-util"] }
mimalloc = "0.1.52"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "native-tls-vendored",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
debug-assertions = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
