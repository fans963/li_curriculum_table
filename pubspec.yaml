name: li_curriculum_table
description: "一款轻盈优雅的跨平台课表应用。"
publish_to: "none"
version: 2.0.1+2001

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  rust_lib_li_curriculum_table:
    path: rust_builder
  flutter_rust_bridge: ^2.13.0
  intl: ^0.20.3
  signals: ^7.1.0
  get_it: ^9.3.0
  window_manager: ^0.5.2
  dynamic_color: ^2.1.0
  flex_color_scheme: ^9.0.0
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  logging: ^1.3.0
  infinite_calendar_view: ^2.11.5
  auto_size_text: ^3.0.0
  pool: ^1.5.3
  freezed_annotation: ^3.1.0
  feedback: ^3.2.0
  path_provider: ^2.1.6
  share_plus: ^13.2.0
  collection: ^1.19.1
  package_info_plus: ^10.2.0
  url_launcher: ^6.3.2
  markdown_widget: ^2.3.2+8
  geolocator: ^14.1.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  cached_network_image: ^4.0.2
  animations: ^3.0.0
  open_filex: ^4.7.0
  material_ui: 1.4.0
  material_3_expressive: ^1.1.3

dependency_overrides:
  uuid: ^4.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons:
    git:
      url: https://github.com/devmil/flutter_launcher_icons.git
  msix: ^3.18.0
  freezed: ^4.0.2
  json_serializable: ^6.14.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

msix_config:
  display_name: 🍐课表
  publisher_display_name: fan
  identity_name: company.suite.flutterapp
  msix_version: 1.0.0.0
  logo_path: assets/icon/icon.png
  capabilities: internetClient, location, microphone, webcam
