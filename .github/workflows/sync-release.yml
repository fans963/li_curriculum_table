name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-gitee:
    name: Sync to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitee token
        id: check
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync GitHub Release to Gitee
        if: steps.check.outputs.has_token == 'true'
        uses: trustedinster/sync-release-gitee@v1.3
        with:
          gitee_owner: fans963
          gitee_repo: li_curriculum_table
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          github_owner: fans963
          github_repo: li_curriculum_table
          gitee_upload_retry_times: 3

      - name: Report failure
        if: failure()
        run: |
          echo "::warning::Gitee sync failed for ${{ github.event.release.tag_name }}"
