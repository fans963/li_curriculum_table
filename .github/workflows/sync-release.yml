name: Sync Release to Gitee

on:
  workflow_run:
    workflows: ["Production Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sync-gitee:
    name: Sync to Gitee
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.get_version.outputs.version }}" --repo ${{ github.repository }} &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ steps.get_version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Gitee token
        id: check
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync GitHub Release to Gitee
        if: steps.check_release.outputs.exists == 'true' && steps.check.outputs.has_token == 'true'
        uses: trustedinster/sync-release-gitee@v1.3
        with:
          gitee_owner: fans963
          gitee_repo: li_curriculum_table
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          github_owner: fans963
          github_repo: li_curriculum_table
          gitee_upload_retry_times: 3

      - name: Report failure
        if: failure()
        run: |
          echo "::warning::Gitee sync failed for ${{ steps.check_release.outputs.tag }}"
